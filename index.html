<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperatura Recife — Martins Engenharia</title>
  <style>
    :root {
      --paper: #F3EFE6;
      --ink: #1A211C;
      --moss: #1B4334;
      --brass: #9A7344;
      --blue: #1a4a7a;
    }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--brass);
    }
    header svg {
      flex-shrink: 0;
    }
    header .brand-sub {
      font-size: 0.85rem;
      color: var(--brass);
      margin: 0.25rem 0 0;
    }
    h1 {
      color: var(--moss);
      margin-top: 0;
    }
    .current {
      background: white;
      border: 1px solid var(--brass);
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
    }
    .temp {
      font-size: 4rem;
      font-weight: bold;
      color: var(--moss);
      margin: 0.5rem 0;
    }
    .fonte {
      font-size: 0.9rem;
      color: #666;
      margin-top: 1rem;
    }
    .previsao {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    .dia {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
    }
    .dia h3 {
      margin: 0 0 0.5rem;
      color: var(--moss);
      font-size: 1rem;
    }
    .updated {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-top: 2rem;
    }
    .aviso {
      background: #fff3cd;
      border-left: 4px solid var(--brass);
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="200" height="58" aria-label="Logo Martins Engenharia">
        <g transform="translate(8, 8)">
          <polygon points="32,0 48,16 32,32 16,16" fill="#1a4a7a"/>
          <polygon points="16,16 32,32 16,48 0,32" fill="#2a6cb0"/>
          <polygon points="32,32 48,48 32,64 16,48" fill="#1a4a7a"/>
          <polygon points="32,0 48,16 64,32 48,48 32,32" fill="#3d8fd4"/>
          <polygon points="32,16 40,24 32,32 24,24" fill="#5aa8e8"/>
        </g>
        <text x="80" y="38" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1a2a3a">Martins</text>
        <text x="80" y="56" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="500" fill="#4a6a8a" letter-spacing="3.5">ENGENHARIA</text>
      </svg>
      <div>
        <p class="brand-sub">Temperatura em Recife</p>
      </div>
    </header>

    <p>Dashboard atualizado automaticamente a cada hora.</p>

    <div id="aviso" class="aviso" style="display:none;"></div>

    <div class="current">
      <div id="condicao">Carregando...</div>
      <div class="temp" id="temp">--°C</div>
      <div class="fonte" id="fonte"></div>
    </div>

    <h2>Previsão para 5 dias</h2>
    <div class="previsao" id="previsao"></div>

    <div class="updated" id="updated"></div>
  </div>

  <script>
    async function carregar() {
      try {
        const resp = await fetch('temperatura.json?t=' + Date.now());
        if (!resp.ok) throw new Error('Arquivo não encontrado');
        const data = await resp.json();

        document.getElementById('temp').textContent = (data.temperatura_atual ?? '--') + '°C';
        document.getElementById('condicao').textContent = data.condicao || '—';
        document.getElementById('fonte').textContent = 'Fonte: ' + (data.fonte || 'desconhecida');

        const prev = document.getElementById('previsao');
        prev.innerHTML = '';
        (data.previsao || []).forEach(dia => {
          const div = document.createElement('div');
          div.className = 'dia';
          const dataFmt = new Date(dia.data + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
          div.innerHTML = `
            <h3>${dataFmt}</h3>
            <div>${dia.condicao || ''}</div>
            <div><strong>${dia.temp_max ?? '—'}°</strong> / ${dia.temp_min ?? '—'}°</div>
          `;
          prev.appendChild(div);
        });

        const upd = document.getElementById('updated');
        if (data.atualizado_em) {
          const d = new Date(data.atualizado_em);
          upd.textContent = 'Atualizado em: ' + d.toLocaleString('pt-BR', { timeZone: 'America/Recife' });
        }

        const aviso = document.getElementById('aviso');
        if (data.fonte && !data.fonte.includes('INMET')) {
          aviso.textContent = 'Nota: temperatura atual via ' + data.fonte + ' (INMET não disponível ou sem token).';
          aviso.style.display = 'block';
        }
      } catch (e) {
        document.getElementById('condicao').textContent = 'Erro ao carregar dados';
        console.error(e);
      }
    }
    carregar();
  </script>
</body>
</html>
